vm:
  name: "clayvm"
  version: "1.0"

  stack:
    type: "dynamic"
    max_depth: 4096
    value_type: "tagged_union"

  types:
    - int64
    - double
    - bool
    - string
    - object

  features:
    interned_strings: true
    garbage_collection:
      enabled: false
    closures: false
    modules:
      enabled: false
    coroutines: false
    debug_tracing: true
    nan_boxing: false
    exception_handling: true
    expose_dispatch_table: true

  dispatch: "auto"

  instructions:
    # Stack manipulation
    - name: PUSH_CONST
      operands: [{ name: index, type: uint16 }]
      description: "Push constant at index onto stack"
      action: "push constants[index]"

    - name: POP
      operands: []
      description: "Pop and discard top of stack"
      action: "pop"

    - name: DUP
      operands: []
      description: "Duplicate top of stack"
      action: "dup"

    # Arithmetic
    - name: ADD
      operands: []
      description: "Pop two values, push their sum"
      typed_action:
        int64: "pop b; pop a; push a + b"
        double: "pop b; pop a; push a + b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_ADD);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in ADD");
              return -1;
          }
      stack_effect: -1

    - name: SUB
      operands: []
      description: "Pop two values, push their difference"
      typed_action:
        int64: "pop b; pop a; push a - b"
        double: "pop b; pop a; push a - b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_SUB);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in SUB");
              return -1;
          }
      stack_effect: -1

    - name: MUL
      operands: []
      description: "Pop two values, push their product"
      typed_action:
        int64: "pop b; pop a; push a * b"
        double: "pop b; pop a; push a * b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_MUL);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in MUL");
              return -1;
          }
      stack_effect: -1

    - name: DIV
      operands: []
      description: "Pop two values, push their quotient"
      action_c: |
        clayvm_value_t b = clayvm_vm_pop(vm);
        clayvm_value_t a = clayvm_vm_pop(vm);
        if (a.type == CLAYVM_VAL_INT64 && b.type == CLAYVM_VAL_INT64) {
            if (b.as.i64 == 0) {
                if (vm->arith_fallback) {
                    vm->arith_fallback(vm, a, b, CLAYVM_OP_DIV);
                } else {
                    clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "division by zero");
                    return -1;
                }
            } else {
                clayvm_vm_push(vm, CLAYVM_INT64(a.as.i64 / b.as.i64));
            }
        } else if (a.type == CLAYVM_VAL_DOUBLE && b.type == CLAYVM_VAL_DOUBLE) {
            clayvm_vm_push(vm, CLAYVM_DOUBLE(a.as.f64 / b.as.f64));
        } else if (vm->arith_fallback) {
            vm->arith_fallback(vm, a, b, CLAYVM_OP_DIV);
        } else {
            clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in DIV");
            return -1;
        }
      stack_effect: -1

    - name: MOD
      operands: []
      description: "Pop two values, push remainder"
      typed_action:
        int64: "pop b; pop a; push a % b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_MOD);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in MOD");
              return -1;
          }
      stack_effect: -1

    - name: NEGATE
      operands: []
      description: "Negate top of stack"
      action: "pop a; push -a"

    # Comparison
    - name: EQ
      operands: []
      description: "Pop two values, push true if equal"
      typed_action:
        int64: "pop b; pop a; push a == b"
        double: "pop b; pop a; push a == b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_EQ);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in EQ");
              return -1;
          }
      stack_effect: -1

    - name: NEQ
      operands: []
      description: "Pop two values, push true if not equal"
      typed_action:
        int64: "pop b; pop a; push a != b"
        double: "pop b; pop a; push a != b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_NEQ);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in NEQ");
              return -1;
          }
      stack_effect: -1

    - name: LT
      operands: []
      description: "Pop two values, push true if a < b"
      typed_action:
        int64: "pop b; pop a; push a < b"
        double: "pop b; pop a; push a < b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_LT);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in LT");
              return -1;
          }
      stack_effect: -1

    - name: GT
      operands: []
      description: "Pop two values, push true if a > b"
      typed_action:
        int64: "pop b; pop a; push a > b"
        double: "pop b; pop a; push a > b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_GT);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in GT");
              return -1;
          }
      stack_effect: -1

    - name: LTE
      operands: []
      description: "Pop two values, push true if a <= b"
      typed_action:
        int64: "pop b; pop a; push a <= b"
        double: "pop b; pop a; push a <= b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_LTE);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in LTE");
              return -1;
          }
      stack_effect: -1

    - name: GTE
      operands: []
      description: "Pop two values, push true if a >= b"
      typed_action:
        int64: "pop b; pop a; push a >= b"
        double: "pop b; pop a; push a >= b"
        default: |
          if (vm->arith_fallback) {
              vm->arith_fallback(vm, a, b, CLAYVM_OP_GTE);
          } else {
              clayvm_vm_error(vm, CLAYVM_ERR_TYPE_MISMATCH, "type mismatch in GTE");
              return -1;
          }
      stack_effect: -1

    - name: NOT
      operands: []
      description: "Logical not"
      action: "pop a; push !a"

    # Control flow
    - name: JUMP
      operands: [{ name: offset, type: int16 }]
      description: "Unconditional jump by offset"
      action: "jump $offset"

    - name: JUMP_IF_FALSE
      operands: [{ name: offset, type: int16 }]
      description: "Pop and jump by offset if falsy"
      action_c: |
        clayvm_value_t _val = clayvm_vm_pop(vm);
        int _falsy = (_val.type == CLAYVM_VAL_NIL) || (_val.as.i64 == 0);
        if (_falsy) vm->ip += offset;

    - name: CALL
      operands: [{ name: func_index, type: uint16 }, { name: arity, type: uint8 }]
      description: "Call function at index with arity arguments"
      action: "call $func_index $arity"

    - name: CALL_NATIVE
      operands: [{ name: func_index, type: uint16 }, { name: arity, type: uint8 }]
      description: "Call native function"
      action_c: |
        clayvm_native_call(&vm->natives, func_index, vm, arity);

    - name: RETURN
      operands: []
      description: "Return from current function"
      action: "return"

    - name: HALT
      operands: []
      description: "Stop execution"
      action: "halt"

    # Local variables
    - name: GET_LOCAL
      operands: [{ name: slot, type: uint16 }]
      description: "Push local variable from stack slot relative to frame base"
      action: "push stack[frame.base + slot]"

    - name: SET_LOCAL
      operands: [{ name: slot, type: uint16 }]
      description: "Store top of stack into local variable slot (does not pop). Releases old value."
      action_c: |
        uint32_t _base = (uint32_t)vm->frames[vm->frame_count - 1].base_sp;
        clayvm_value_t _old = vm->stack[_base + slot];
        clayvm_value_t _new = vm->stack[vm->sp - 1];
        vm->stack[_base + slot] = _new;
        if (vm->release_fn) vm->release_fn(_old);

    # Exception handling
    - name: TRY_BEGIN
      operands: [{ name: handler_offset, type: int16 }]
      description: "Begin try block; handler at ip + offset"
      action: "try_begin $handler_offset"

    - name: TRY_END
      operands: []
      description: "End try block; pop exception frame"
      action: "try_end"

    - name: CATCH
      operands: []
      description: "Catch exception; push exception value"
      action: "catch ex; push ex"

    - name: THROW
      operands: []
      description: "Throw top of stack as exception"
      action: "pop ex; throw ex"

  constants:
    - int64
    - double
    - string

  constant_pool:
    type: "dynamic"
    initial_capacity: 256

  frames:
    type: "dynamic"
    max_depth: 64

  vm_extensions:
    - { name: natives, type: "clayvm_native_table_t", include: "native.h" }
    - { name: globals, type: "void *", comment: "HashTable* for REPL variable persistence" }
    - { name: arith_fallback, type: "void (*)(clayvm_vm_t *, clayvm_value_t, clayvm_value_t, int)", comment: "Fallback for non-numeric binary ops" }
    - { name: retain_fn, type: "void (*)(clayvm_value_t)", comment: "Retain callback for OBJECT values (refcount++)" }
    - { name: release_fn, type: "void (*)(clayvm_value_t)", comment: "Release callback for OBJECT values (refcount--)" }
