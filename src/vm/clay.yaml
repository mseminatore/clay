vm:
  name: "clayvm"
  version: "1.0"

  stack:
    type: "dynamic"
    max_depth: 4096
    value_type: "tagged_union"

  types:
    - int64
    - double
    - bool
    - string
    - object

  features:
    interned_strings: true
    garbage_collection:
      enabled: false
    closures: true
    modules:
      enabled: false
    coroutines: false
    debug_tracing: true
    nan_boxing: false
    exception_handling: true
    expose_dispatch_table: true

  dispatch: "auto"

  instructions:
    # Stack manipulation
    - name: PUSH_CONST
      operands: [{ name: index, type: uint16 }]
      description: "Push constant at index onto stack"
      action: "push constants[$index]"

    - name: POP
      operands: []
      description: "Pop and discard top of stack"
      action: "pop _"

    - name: DUP
      operands: []
      description: "Duplicate top of stack"
      action: "peek a; push a"

    # Arithmetic
    - name: ADD
      operands: []
      description: "Pop two values, push their sum"
      action: "pop b; pop a; push a + b"
      stack_effect: -1

    - name: SUB
      operands: []
      description: "Pop two values, push their difference"
      action: "pop b; pop a; push a - b"
      stack_effect: -1

    - name: MUL
      operands: []
      description: "Pop two values, push their product"
      action: "pop b; pop a; push a * b"
      stack_effect: -1

    - name: DIV
      operands: []
      description: "Pop two values, push their quotient"
      action: "pop b; pop a; push a / b"
      stack_effect: -1

    - name: MOD
      operands: []
      description: "Pop two values, push remainder"
      action_c: |
        int64_t b = clayvm_vm_pop(vm).as.i64;
        int64_t a = clayvm_vm_pop(vm).as.i64;
        clayvm_vm_push(vm, CLAYVM_INT64(a % b));
      stack_effect: -1

    - name: NEGATE
      operands: []
      description: "Negate top of stack"
      action: "pop a; push -a"

    # Comparison
    - name: EQ
      operands: []
      description: "Pop two values, push true if equal"
      action: "pop b; pop a; push a == b"
      stack_effect: -1

    - name: NEQ
      operands: []
      description: "Pop two values, push true if not equal"
      action: "pop b; pop a; push a != b"
      stack_effect: -1

    - name: LT
      operands: []
      description: "Pop two values, push true if a < b"
      action: "pop b; pop a; push a < b"
      stack_effect: -1

    - name: GT
      operands: []
      description: "Pop two values, push true if a > b"
      action: "pop b; pop a; push a > b"
      stack_effect: -1

    - name: LTE
      operands: []
      description: "Pop two values, push true if a <= b"
      action: "pop b; pop a; push a <= b"
      stack_effect: -1

    - name: GTE
      operands: []
      description: "Pop two values, push true if a >= b"
      action: "pop b; pop a; push a >= b"
      stack_effect: -1

    - name: NOT
      operands: []
      description: "Logical not"
      action: "pop a; push !a"

    # Control flow
    - name: JUMP
      operands: [{ name: offset, type: int16 }]
      description: "Unconditional jump by offset"
      action: "jump $offset"

    - name: JUMP_IF_FALSE
      operands: [{ name: offset, type: int16 }]
      description: "Pop and jump by offset if falsy"
      action: "pop a; jump_if_zero a $offset"

    - name: CALL
      operands: [{ name: func_index, type: uint16 }, { name: arity, type: uint8 }]
      description: "Call function at index with arity arguments"
      action: "call $func_index $arity"

    - name: CALL_NATIVE
      operands: [{ name: func_index, type: uint16 }, { name: arity, type: uint8 }]
      description: "Call native function"
      action_c: |
        clayvm_native_call(&vm->natives, func_index, vm, arity);

    - name: RETURN
      operands: []
      description: "Return from current function"
      action: "return"

    - name: HALT
      operands: []
      description: "Stop execution"
      action: "halt"

    # Local variables
    - name: GET_LOCAL
      operands: [{ name: slot, type: uint16 }]
      description: "Push local variable from stack slot relative to frame base"
      action_c: |
        clayvm_vm_push(vm, vm->stack[vm->frames[vm->frame_count - 1].base_sp + slot]);

    - name: SET_LOCAL
      operands: [{ name: slot, type: uint16 }]
      description: "Store top of stack into local variable slot (does not pop)"
      action_c: |
        vm->stack[vm->frames[vm->frame_count - 1].base_sp + slot] = vm->stack[vm->sp - 1];

    # Upvalue access (closures)
    - name: GET_UPVALUE
      operands: [{ name: index, type: uint16 }]
      description: "Read captured variable via upvalue index"
      action_c: |
        /* Upvalue access is handled through native calls for now */
        (void)index;

    - name: SET_UPVALUE
      operands: [{ name: index, type: uint16 }]
      description: "Write captured variable via upvalue index"
      action_c: |
        /* Upvalue write is handled through native calls for now */
        (void)index;

    - name: CLOSE_UPVALUE
      operands: [{ name: slot, type: uint16 }]
      description: "Close all open upvalues at or above the given stack slot"
      action_c: |
        /* Close upvalue is handled through native calls for now */
        (void)slot;

    # Exception handling
    - name: TRY_BEGIN
      operands: [{ name: handler_offset, type: int16 }]
      description: "Begin try block; handler at ip + offset"
      action: "try_begin $handler_offset"

    - name: TRY_END
      operands: []
      description: "End try block; pop exception frame"
      action: "try_end"

    - name: CATCH
      operands: []
      description: "Catch exception; push exception value"
      action: "catch ex; push ex"

    - name: THROW
      operands: []
      description: "Throw top of stack as exception"
      action: "pop ex; throw ex"

  constants:
    - int64
    - double
    - string

  constant_pool:
    type: "dynamic"
    initial_capacity: 256

  frames:
    type: "dynamic"
    max_depth: 64

  vm_extensions:
    - { name: natives, type: "clayvm_native_table_t", include: "native.h" }
    - { name: globals, type: "void *", comment: "HashTable* for REPL variable persistence" }
